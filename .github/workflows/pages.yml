name: Docs sites

on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/docs/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Assemble the site from plugins/*/docs
        run: |
          set -euo pipefail
          mkdir -p _site
          cp .github/pages/index.html _site/index.html
          shopt -s nullglob
          for dir in plugins/*/docs; do
            [ -d "$dir" ] || continue
            plugin=$(basename "$(dirname "$dir")")
            slug=$(printf '%s' "$plugin" | tr '[:upper:]' '[:lower:]')
            mkdir -p "_site/$slug"
            cp -R "$dir"/. "_site/$slug/"
            rm -f "_site/$slug/.nojekyll"
            echo "  $plugin -> /$slug/"
          done
          echo "site root:"
          ls -1 _site

      # v3. Long line: the 40-char commit SHA is what makes the tag immutable.
      # pi-lens-ignore: line-length
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        # v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
